# Triveria s. r. o. — the Madrid interop registration. The participant: the
# Slovak DIČ 2022951381 (ICD 0245 - the scheme the Slovak Peppol Authority,
# Finančná správa SR, uses for Slovak organisations; IČO 45362238 has no ICD
# of its own), the value lower-cased and hyphen-stripped per ID-01/ID-02.
#
# NOTE: the registry's config.yaml participant_schemes (ID-03) does not list
# 0245 yet - the PR asks for it (the same pattern as Cleverbase's 0106 ask).
participant:
  scheme: urn:oasis:names:tc:ebcore:partyid-type:iso6523:0245   # lower case (ID-01)
  value: "2022951381"                                            # hyphen stripped (ID-01/ID-02)
  name: Triveria s. r. o.
  registrant: Triveria s. r. o.
services:
  - service:
      scheme: bdx-docid-qns
      value: "urn:webuild:qerds:wmp-test:1.0"       # PLACEHOLDER: the agreed demo document type
    processMetadata:
      - process:
          value: "urn:webuild:proc:wmp-test:1.0"     # PLACEHOLDER
        endpoints:
          - transportProfile: webuild-transport-wmp-v1
            address: https://wallet.triveria.io/api/v1/wmp/placeholder   # PLACEHOLDER: the Triveria business wallet's WMP endpoint
            description: Triveria business wallet WMP endpoint (TEST)
            contact: mailto:martin@triveria.io
            expirationDate: "2027-12-31"
            # Test mode (the ladder's own agreement): no qualified certificate
            # behind this endpoint yet - the test CA decision is pending in
            # the Slack channel ("Test trust anchor").
  # The well-known configuration: served at /.well-known/wmp-configuration
  # through the same location.
  # No OID4VC services in the SMP record yet: whether the wallet's issuance
  # and presentation endpoints register as services follows the EBW EAA
  # decision (SPEC 8.2 placeholders).
