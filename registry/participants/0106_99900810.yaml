# One file per participant (REG-01). NEWPS interop test: a fictitious TEST organisation for an outside tester (NEWPS.cz).
# Organisation in Cleverbase's interop business wallet sandbox (interop.business-sandbox.cleverbase.io),
# EBWOID NL-99900810-0001, served by cleverbase-erds-wb.
participant:
  scheme: urn:oasis:names:tc:ebcore:partyid-type:iso6523:0106   # lower case (ID-01)
  value: "99900810"
  name: NEWPS interop test (TEST)               # informational, not published
  registrant: Cleverbase ID B.V.  # informational, not published
services:
  # Registered delivery. WE BUILD has not fixed an ERD service or process identifier yet (SPEC section 12); these are
  # the AS4 Action and Service of ETSI EN 319 522-4-1 V1.2.1 clause 5 for an ERD dispatch.
  - service:
      value: "http://uri.etsi.org/19522/v1#/as4binding/Actions/ERDdispatch"
    processMetadata:
      - process:
          value: "http://uri.etsi.org/19522/v1#/as4binding/Relay"
        endpoints:
          # QERDS to QERDS (CS-16). Our access point speaks eDelivery AS4 2.0 with Ed25519 signing and X25519 key
          # agreement: eDelivery SMP 2.0 profile id bdxr-transport-ebms3-as4-v2p0-curve25519.
          - transportProfile: bdxr-transport-ebms3-as4-v2p0-curve25519
            address: https://as4-wb.business-sandbox.cleverbase.io/as4
            erds: cleverbase-erds-wb
            description: AS4 access point of Cleverbase ERDS (WE BUILD) (TEST, AS4 2.0)
            activationDate: "2026-11-17"
            expirationDate: "2027-11-17"
            certificates:
              - certificate: ../certs/cleverbase-erds-wb-as4-signing.pem
                typeCode: signing
              - certificate: ../certs/cleverbase-erds-wb-as4-encryption.pem
                typeCode: encryption
          # The participant's business wallet at its QERDS (CS-15, WMP over HTTPS); the certificate is the QERDS's
          # seal that signs its /.well-known/wmp-configuration.
          - transportProfile: webuild-transport-wmp-v1
            address: https://erds-wb.business-sandbox.cleverbase.io/wmp
            description: WMP door of Cleverbase ERDS (WE BUILD) (TEST)
            activationDate: "2026-11-17"
            expirationDate: "2027-11-17"
            certificates:
              - certificate: ../certs/cleverbase-erds-wb-seal.pem
                typeCode: signing
